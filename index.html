<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MOOC Révision" />
  <link rel="manifest" href="./manifest.webmanifest?v=3" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./styles.css?v=3" />
  <title>MOOC Révision</title>
</head>
<body>
  <div id="app"></div>
  <input id="packInput" type="file" accept="application/json,.json" hidden />
  <input id="backupInput" type="file" accept="application/json,.json" hidden />
  <script src="./app-v2.js?v=3"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=3', { scope: './' }).catch(console.error);
      });
    }
  </script>
</body>
</html>
