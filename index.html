<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MOOC Révision">
  <link rel="manifest" href="./manifest.webmanifest?v=4">
  <link rel="apple-touch-icon" href="./icon-192.png?v=4">
  <link rel="stylesheet" href="./styles.css?v=4">
  <title>MOOC Révision</title>
  <style>
    html,body{min-height:100%;margin:0;background:#0b1020;color:#f5f7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #boot{padding:28px 20px;max-width:700px;margin:auto}#boot h1{font-size:28px;margin:0 0 8px}#boot p{opacity:.72}
  </style>
</head>
<body>
  <div id="boot"><h1>MOOC Révision</h1><p>Chargement de l’application…</p></div>
  <div id="app"></div>
  <input id="packInput" type="file" accept="application/json,.json" hidden>
  <input id="backupInput" type="file" accept="application/json,.json" hidden>
  <script>
    window.addEventListener('error',function(e){var b=document.getElementById('boot');if(b){b.innerHTML='<h1>MOOC Révision</h1><p>Erreur JavaScript : '+String(e.message||'inconnue')+'</p>';}});
  </script>
  <script src="./app-v2.js?v=4"></script>
  <script>
    var boot=document.getElementById('boot');
    if(document.getElementById('app').children.length && boot) boot.remove();
    setTimeout(function(){var a=document.getElementById('app'),b=document.getElementById('boot');if(b&&a&&a.children.length)b.remove();},1000);
    if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));}).catch(function(){});});}
  </script>
</body>
</html>
