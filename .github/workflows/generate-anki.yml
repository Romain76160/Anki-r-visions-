name: Generate Anki cards with OpenAI

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Call OpenAI to generate Anki cards
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p generated
          # Example prompt: you can edit this prompt later in the workflow or in a script
          read -r -d '' PROMPT <<'EOF'
You are a helpful assistant that outputs Anki cards in Markdown, one card per line, using the format:
Front | Back

Génère 10 cartes Anki en français sur le thème "visions". Pour chaque carte, donne une question courte (Front) et la réponse (Back).
EOF

          response=$(curl -s -X POST "https://api.openai.com/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "{\"model\":\"gpt-4o-mini\",\"messages\":[{\"role\":\"system\",\"content\":\"You are a helpful assistant that outputs Anki cards in Markdown, one card per line with format: Front | Back\"},{\"role\":\"user\",\"content\":$(jq -Rsa --arg p "$PROMPT" '$p')}] ,\"max_tokens\":800}")

          echo "$response" > generated/anki_raw.json
          echo "$response" | jq -r '.choices[0].message.content' > generated/anki_cards.md || true

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generated/anki_cards.md generated/anki_raw.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Generate Anki cards via OpenAI"
            git push
          else
            echo "No changes to commit"
          fi
