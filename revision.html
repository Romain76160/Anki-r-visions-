<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MOOC Révision</title>
<style>
:root{--bg:#0b1020;--panel:#121a2e;--panel2:#18233c;--text:#f7f8fb;--muted:#9aa6bd;--accent:#6c63ff;--danger:#d14343;--hard:#d9811e;--good:#2f9e61;--easy:#3978d7;--border:rgba(255,255,255,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:760px;margin:auto;padding:18px 16px 110px}.top{font-size:24px;font-weight:800;margin-bottom:16px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:18px;margin-bottom:14px}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat{background:var(--panel2);border-radius:16px;padding:12px}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}button{width:100%;border:0;border-radius:15px;padding:14px;font:inherit;font-weight:700;color:#fff;background:var(--accent)}
.question-wrap{padding:24px 4px 18px}.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin-bottom:10px}.question{font-size:25px;line-height:1.3;font-weight:750;text-align:left}.answer-box{margin-top:18px;padding:18px;border-radius:18px;background:var(--panel2);border:1px solid var(--border)}.answer{font-size:18px;line-height:1.55;text-align:left}.explanation{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);font-size:15px;line-height:1.5;color:#c8d0df}.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:16px}.grades button{padding:11px 4px;font-size:12px}.again{background:var(--danger)}.hard{background:var(--hard)}.good{background:var(--good)}.easy{background:var(--easy)}.nav{position:fixed;left:0;right:0;bottom:0;background:#0a0f1ddd;padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}.navin{width:min(760px,100%);display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.nav button{background:transparent;color:var(--muted);font-size:12px}.nav button.active{background:var(--panel2);color:#fff}.subject{display:inline-block;background:#2a245c;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:700}.chapter{font-size:12px;color:var(--muted);margin-left:8px}.error{background:#3a1515;border-radius:16px;padding:14px;line-height:1.4}.list{display:flex;flex-direction:column;gap:8px}.item{background:var(--panel2);border-radius:14px;padding:12px}
</style>
</head>
<body>
<div id="root"><div class="wrap"><div class="top">MOOC Révision</div><div class="panel"><b>Chargement…</b><p class="muted">Initialisation des cartes.</p></div></div></div>
<script>
(function(){
'use strict';
var root=document.getElementById('root');
var KEY='moocRevisionSafe.v1';
var state={cards:[],progress:{},tab:'home',session:[],index:0,revealed:false,error:null};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY));if(x){state.progress=x.progress||{};}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({progress:state.progress}));}catch(e){}}
function pfor(id){return state.progress[id]||{count:0,due:0};}
function dueCards(){var t=Date.now();return state.cards.filter(function(c){var p=pfor(c.id);return !p.count||p.due<=t;});}
function counts(){var d=dueCards().length,n=0,l=0;state.cards.forEach(function(c){if(pfor(c.id).count)n++;else l++;});return{due:d,newc:l,learned:n,total:state.cards.length};}
function home(){if(state.error){return '<div class="wrap"><div class="top">MOOC Révision</div><div class="error"><b>Erreur de chargement</b><p>'+esc(state.error)+'</p></div></div>'+nav('home');}var c=counts();return '<div class="wrap"><div class="top">MOOC Révision</div><div class="panel"><h1 style="margin:0 0 8px">'+c.due+' carte'+(c.due>1?'s':'')+' à réviser</h1><p class="muted">Révision active avec question, réponse détaillée et auto-évaluation.</p><div class="stats"><div class="stat"><b>'+c.due+'</b><span>À revoir</span></div><div class="stat"><b>'+c.newc+'</b><span>Nouvelles</span></div><div class="stat"><b>'+c.learned+'</b><span>Apprises</span></div></div><button id="start">Commencer</button></div></div>'+nav('home');}
function study(){var c=state.session[state.index];if(!c)return home();var body='<div class="wrap"><div class="top">Révision '+(state.index+1)+'/'+state.session.length+'</div><div class="panel"><span class="subject">'+esc(c.subject||'Autre')+'</span>'+(c.chapter?'<span class="chapter">'+esc(c.chapter)+'</span>':'')+'<div class="question-wrap"><div class="label">Question</div><div class="question">'+esc(c.prompt)+'</div></div>';
if(!state.revealed){body+='<button id="reveal">Afficher la réponse</button>';}else{body+='<div class="answer-box"><div class="label">Réponse</div><div class="answer">'+esc(c.answer)+'</div>'+(c.explanation?'<div class="explanation"><b>À retenir / explication</b><br>'+esc(c.explanation)+'</div>':'')+'</div><div class="grades"><button class="again" data-g="1">Encore</button><button class="hard" data-g="2">Difficile</button><button class="good" data-g="3">Bien</button><button class="easy" data-g="4">Facile</button></div>';}return body+'</div></div>';}
function library(){var by={};state.cards.forEach(function(c){var s=c.subject||'Autre';by[s]=(by[s]||0)+1;});var h='<div class="wrap"><div class="top">Bibliothèque</div><div class="panel"><b>'+state.cards.length+' cartes</b></div><div class="list">';Object.keys(by).forEach(function(s){h+='<div class="item"><b>'+esc(s)+'</b><div class="muted">'+by[s]+' cartes</div></div>';});return h+'</div></div>'+nav('library');}
function statsPage(){var c=counts(),r=0;Object.keys(state.progress).forEach(function(k){r+=state.progress[k].count||0;});return '<div class="wrap"><div class="top">Statistiques</div><div class="panel"><b>'+r+' réponses enregistrées</b><p class="muted">'+c.learned+'/'+c.total+' cartes déjà étudiées.</p></div></div>'+nav('stats');}
function nav(active){return '<div class="nav"><div class="navin"><button data-tab="home" class="'+(active==='home'?'active':'')+'">Révision</button><button data-tab="library" class="'+(active==='library'?'active':'')+'">Bibliothèque</button><button data-tab="stats" class="'+(active==='stats'?'active':'')+'">Stats</button></div></div>';}
function render(){root.innerHTML=state.tab==='study'?study():state.tab==='library'?library():state.tab==='stats'?statsPage():home();bind();}
function bind(){var tabs=document.querySelectorAll('[data-tab]');for(var i=0;i<tabs.length;i++){tabs[i].onclick=function(){state.tab=this.getAttribute('data-tab');render();};}var s=document.getElementById('start');if(s)s.onclick=function(){state.session=dueCards();state.index=0;state.revealed=false;state.tab='study';render();};var r=document.getElementById('reveal');if(r)r.onclick=function(){state.revealed=true;render();};var gs=document.querySelectorAll('[data-g]');for(var j=0;j<gs.length;j++){gs[j].onclick=function(){grade(parseInt(this.getAttribute('data-g'),10));};}}
function grade(g){var c=state.session[state.index];if(!c)return;var now=Date.now(),days=g===1?0.007:g===2?1:g===3?3:7;state.progress[c.id]={count:(pfor(c.id).count||0)+1,due:now+days*86400000,last:g};save();state.index++;state.revealed=false;if(state.index>=state.session.length){state.tab='home';state.session=[];}render();}
function applyOverrides(cards,overrides){return cards.map(function(c){var o=overrides&&overrides[c.id];if(!o)return c;var copy={};Object.keys(c).forEach(function(k){copy[k]=c[k];});Object.keys(o).forEach(function(k){copy[k]=o[k];});return copy;});}
load();
Promise.all([
  fetch('./starter_questions.json?v=4',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('Questions HTTP '+r.status);return r.json();}),
  fetch('./quality_overrides.json?v=1',{cache:'no-store'}).then(function(r){if(!r.ok)return {};return r.json();}).catch(function(){return {};})
]).then(function(data){var pack=data[0],overrides=data[1];if(!pack||!Array.isArray(pack.questions))throw new Error('Format JSON invalide');state.cards=applyOverrides(pack.questions,overrides);render();}).catch(function(e){state.error=e.message||String(e);render();});
})();
</script>
</body>
</html>
